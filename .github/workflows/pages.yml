name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change this if your default branch is different

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Change based on your project needs

      - name: Install Dependencies
        run: npm install  # Change to 'yarn install' if using Yarn

      - name: Build Project
        run: npm run build  # Change to your build command

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build  # Change this if your output folder is different

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
